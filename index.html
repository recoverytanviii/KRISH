<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MILKEY REAL VIP</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070b16;--card:#0e1424;--line:#202b43;--text:#fff;--muted:#94a0b8;--accent:#7c5cff;--accent2:#19d3ff}
body{
  min-height:100vh;font-family:Inter,Arial,sans-serif;color:var(--text);
  background:
    radial-gradient(circle at 50% -10%,rgba(124,92,255,.28),transparent 38%),
    radial-gradient(circle at 10% 70%,rgba(25,211,255,.10),transparent 28%),
    var(--bg);
  display:flex;justify-content:center;overflow-x:hidden;
}
.container{width:min(100%,620px);padding:28px 18px 30px}
.hero{text-align:center;padding:28px 10px 22px}
.badge{
  display:inline-block;padding:7px 14px;border:1px solid rgba(124,92,255,.45);
  border-radius:999px;background:rgba(124,92,255,.10);color:#bcaeff;
  font-size:12px;font-weight:700;letter-spacing:1.5px;margin-bottom:18px
}
h1{
  font-size:clamp(42px,12vw,72px);line-height:.95;letter-spacing:-3px;
  font-weight:900;
  background:linear-gradient(135deg,#fff 15%,#a995ff 55%,#4de2ff);
  -webkit-background-clip:text;background-clip:text;color:transparent
}
.subtitle{color:var(--muted);font-size:14px;margin-top:14px}
.card{
  background:linear-gradient(180deg,rgba(18,25,43,.94),rgba(10,15,28,.94));
  border:1px solid var(--line);border-radius:22px;padding:22px;
  box-shadow:0 18px 60px rgba(0,0,0,.28);margin-top:16px
}
.card-title{font-size:13px;color:#aab5cc;text-transform:uppercase;letter-spacing:1.5px;text-align:center}
.timer{display:flex;justify-content:center;gap:10px;margin:18px 0 4px}
.timebox{min-width:70px;padding:13px 9px;border-radius:14px;background:#080d19;border:1px solid #202b43;text-align:center}
.timebox b{display:block;font-size:25px}.timebox span{font-size:10px;color:#748099;text-transform:uppercase}
.join{
  display:flex;align-items:center;justify-content:center;width:100%;height:58px;
  border:0;border-radius:16px;color:white;text-decoration:none;font-size:16px;font-weight:800;
  letter-spacing:.4px;background:linear-gradient(100deg,#7155ff,#18c9ff);
  box-shadow:0 12px 35px rgba(83,105,255,.28);transition:.2s
}
.join:hover{transform:translateY(-2px);filter:brightness(1.08)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.stat{text-align:center;padding:20px 8px;border:1px solid var(--line);border-radius:17px;background:rgba(14,20,36,.82)}
.stat strong{display:block;font-size:22px}.stat span{display:block;color:#7f8ba3;font-size:11px;margin-top:6px}
.note{text-align:center;color:#6f7b92;font-size:11px;margin-top:18px;line-height:1.6}
footer{text-align:center;color:#59657b;font-size:11px;padding:25px 0 5px}
@media(max-width:430px){.container{padding:18px 13px}.timer{gap:6px}.timebox{min-width:63px}.grid{gap:8px}.stat{padding:17px 4px}}
</style>
</head>
<body>
<main class="container">
  <section class="hero">
    <div class="badge">VIP ACCESS</div>
    <h1>MILKEY REAL</h1>
    <p class="subtitle">Premium access • Fast &amp; secure</p>
  </section>

  <section class="card">
    <div class="card-title">Limited access ends in</div>
    <div class="timer">
      <div class="timebox"><b id="days">00</b><span>Days</span></div>
      <div class="timebox"><b id="hours">00</b><span>Hours</span></div>
      <div class="timebox"><b id="mins">00</b><span>Min</span></div>
      <div class="timebox"><b id="secs">00</b><span>Sec</span></div>
    </div>
    <a class="join" href="#" onclick="return joinNow()">JOIN NOW</a>
  </section>

  <section class="grid">
    <div class="stat"><strong>12k+</strong><span>Members</span></div>
    <div class="stat"><strong>24/7</strong><span>Support</span></div>
    <div class="stat"><strong>100%</strong><span>Secure</span></div>
  </section>

  <p class="note">Your access is protected with a secure and responsive experience.</p>
  <footer>© 2026 MILKEY REAL VIP. All rights reserved.</footer>
</main>

<script>
const end = Date.now() + 24*60*60*1000;
function pad(n){return String(n).padStart(2,'0')}
function tick(){
  let left=Math.max(0,end-Date.now());
  const d=Math.floor(left/86400000); left-=d*86400000;
  const h=Math.floor(left/3600000); left-=h*3600000;
  const m=Math.floor(left/60000); left-=m*60000;
  const s=Math.floor(left/1000);
  document.getElementById('days').textContent=pad(d);
  document.getElementById('hours').textContent=pad(h);
  document.getElementById('mins').textContent=pad(m);
  document.getElementById('secs').textContent=pad(s);
}
function joinNow(){
  alert('JOIN NOW link ko apne destination URL se replace karein.');
  return false;
}
tick();setInterval(tick,1000);
</script>
</body>
</html>
